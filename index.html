<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Land Rover & Jaguar — Prodeje a reklamace 2025–2026</title>
<style>
  :root {
    --green-dark: #13291F;
    --green: #1B3A2F;
    --gold: #C9A64A;
    --cream: #F4F1EA;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--green-dark);
    font-family: -apple-system, Calibri, "Segoe UI", Arial, sans-serif;
    overflow: hidden;
  }
  .topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    background: var(--green-dark);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 18px; z-index: 20;
    border-bottom: 1px solid #2a4438;
  }
  .topbar .title {
    color: var(--cream); font-size: 14px; letter-spacing: 0.5px; opacity: 0.85;
  }
  .topbar a.download {
    color: var(--green-dark); background: var(--gold);
    text-decoration: none; font-size: 13px; font-weight: 600;
    padding: 7px 14px; border-radius: 6px;
  }
  .stage {
    position: absolute; top: 52px; bottom: 64px; left: 0; right: 0;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .stage img {
    max-width: 100%; max-height: 100%;
    box-shadow: 0 10px 40px rgba(0,0,0,0.5);
    border-radius: 4px;
    user-select: none;
  }
  .controls {
    position: fixed; bottom: 0; left: 0; right: 0; height: 64px;
    display: flex; align-items: center; justify-content: center; gap: 18px;
    background: var(--green-dark); border-top: 1px solid #2a4438;
    z-index: 20;
  }
  .nav-btn {
    background: var(--green); color: var(--cream); border: 1px solid #3a5747;
    width: 40px; height: 40px; border-radius: 50%; font-size: 18px;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
  }
  .nav-btn:hover { background: #244639; }
  .nav-btn:disabled { opacity: 0.3; cursor: default; }
  .counter { color: var(--cream); font-size: 14px; min-width: 70px; text-align: center; }
  .dots { display: flex; gap: 6px; }
  .dot {
    width: 8px; height: 8px; border-radius: 50%; background: #3a5747; cursor: pointer;
  }
  .dot.active { background: var(--gold); }
  @media (max-width: 700px) {
    .topbar .title { display: none; }
    .dots { display: none; }
  }
</style>
</head>
<body>

  <div class="topbar">
    <div class="title">Land Rover &amp; Jaguar — Prodeje a reklamace 2025–2026 · Carvago</div>
    <a class="download" href="Land-Rover-Jaguar-Prezentace.pptx" download>⬇ Stáhnout .pptx</a>
  </div>

  <div class="stage">
    <img id="slideImg" src="slide-01.jpg" alt="Slide 1">
  </div>

  <div class="controls">
    <button class="nav-btn" id="prevBtn" title="Předchozí (←)">‹</button>
    <div class="dots" id="dots"></div>
    <div class="counter" id="counter">1 / 10</div>
    <button class="nav-btn" id="nextBtn" title="Další (→)">›</button>
  </div>

<script>
  const totalSlides = 10;
  let current = 1;
  const img = document.getElementById('slideImg');
  const counter = document.getElementById('counter');
  const dotsWrap = document.getElementById('dots');
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');

  for (let i = 1; i <= totalSlides; i++) {
    const d = document.createElement('div');
    d.className = 'dot' + (i === 1 ? ' active' : '');
    d.dataset.i = i;
    d.addEventListener('click', () => goTo(i));
    dotsWrap.appendChild(d);
  }

  function pad(n) { return n < 10 ? '0' + n : '' + n; }

  function render() {
    img.src = 'slide-' + pad(current) + '.jpg';
    img.alt = 'Slide ' + current;
    counter.textContent = current + ' / ' + totalSlides;
    prevBtn.disabled = current === 1;
    nextBtn.disabled = current === totalSlides;
    [...dotsWrap.children].forEach((d, idx) => {
      d.classList.toggle('active', idx + 1 === current);
    });
  }

  function goTo(n) {
    current = Math.min(totalSlides, Math.max(1, n));
    render();
  }

  prevBtn.addEventListener('click', () => goTo(current - 1));
  nextBtn.addEventListener('click', () => goTo(current + 1));

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === ' ') goTo(current + 1);
    if (e.key === 'ArrowLeft') goTo(current - 1);
  });

  // basic swipe support for mobile
  let touchStartX = null;
  document.addEventListener('touchstart', (e) => { touchStartX = e.touches[0].clientX; });
  document.addEventListener('touchend', (e) => {
    if (touchStartX === null) return;
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (dx > 50) goTo(current - 1);
    if (dx < -50) goTo(current + 1);
    touchStartX = null;
  });

  render();
</script>
</body>
</html>
